name: null
dataset_name: null
source_dataset_name: null

num_iterations: 100000
resume_iteration: 0
batch_size: 32
grad_accum: 1  # micro-batches of batch_size per optimizer step
num_workers: 8
material_lr: 1e-4
material_wd: 0.0
material_grad_max_norm: 0.1
training_start_episode: 0
training_end_episode: 1000
eval_start_episode: 0
eval_end_episode: 10
iteration_log_interval: 10
iteration_save_interval: 1000
snapshot_every: 10000  # also keep model-<step>.pt every N steps (0 = latest/best/final only)
iteration_eval_interval: 10000
loss_factor: 1.0
loss_factor_v: 0.0
loss_factor_x: 100.0
friction_lr: 1e-1
friction_wd: 0.0
friction_grad_max_norm: 0.1
dataset_load_skip_frame: 1
dataset_skip_frame: 1
importance_sampling: True
domain_batches: False  # domain-pure batches, uniform over domains (needs converter metadata 'ranges')
domain_weighting: uniform  # uniform | episodes (bucket share of batches follows its episode count)
source_format: pgnd  # pgnd (episode dirs) | pwm_mpm_drag | pwm_dex | pwm_folding (read that PWM release directly)
pwm_root: null  # pwm_mpm_drag / pwm_dex: release root holding train/ test/
pwm_max_episodes: 0  # smokes only: load this many evenly spaced episodes per split (0 = all)
exclude_episodes: null  # JSON {"episodes": [episode dir names]} to skip (file mode)
downsample: False
use_pv: False
use_gs: False
dataset_non_overwrite: True
pwm_window_motion:  # pwm_folding: p(start) ∝ (mean cloth step over the future transitions + floor_mm)^alpha (PWM recipe data.window_motion)
  alpha: 1.0
  floor_mm: 0.02
pwm_record_pick: null  # pwm_folding memory checks: 'largest' = train on the largest garment only
detect_anomaly: True  # stock PGND: autograd anomaly detection on every step (debug checks only; False = faster, same math)
