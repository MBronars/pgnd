num_steps_train: 5
num_steps: 1000
interval: 1
num_grids: [50, 50, 50, 0.02]
dt: 0.1
bound: 3
eps: 1e-7
skip_frame: 1
num_grippers: 1
preprocess_scale: 1.0
preprocess_with_table: True
n_particles: 1000
n_gripper_particles: null  # subsample gripper_points to this count per gripper (matches PGND's RealGripperDataset n=500); null = no subsample
gripper_forcing: True
gripper_points: False
n_history: 2
uniform: False
drag_sphere: tied   # mpm_drag forcing sphere: tied = on the recorded patch centroid (Sept 2026 runs); reanchor = on the patch at each drag start, then moved only by the command
